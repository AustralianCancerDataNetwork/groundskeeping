[project]
name = "groundskeeping"
dynamic = ["version"]
description = "Reusable Textual operator shell, workbench, configuration browser, and telemetry primitives."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "UNSW CAVA platform tooling" },
]
dependencies = [
    "oa-configurator>=0.1.2,<0.3",
    "textual>=8.2,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.4",
    "ty>=0.0.59",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings-python>=2.0.1",
]

[project.scripts]
groundskeeping = "groundskeeping.demo:main"
groundskeeping-demo = "groundskeeping.demo:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/groundskeeping"]

[tool.uv]
package = true
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["src"]
