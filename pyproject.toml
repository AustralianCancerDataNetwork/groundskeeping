[project]
name = "groundskeeping"
version = "0.1.0"
description = "Reusable Textual operator shell, workbench, configuration browser, and telemetry primitives."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "UNSW CAVA platform tooling" },
]
dependencies = [
    "oa-configurator>=0.1.2,<0.3",
    "textual>=8.2,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
groundskeeping = "groundskeeping.demo:main"
groundskeeping-demo = "groundskeeping.demo:main"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundskeeping = [
    "themes/*.tcss",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
